id: mongodb-unauth
name: MongoDB without authentication
severity: critical
tags: [mongodb, unauth, exposure, database]
port: 27017
protocol: tcp
description: >
  MongoDB's wire protocol answers without credentials. Databases can be
  dumped, modified, or dropped outright — the 2017 MongoRansom wave that
  encrypted and held collections for ransom targeted exactly this setup.
remediation: >
  Enable authorization (security.authorization: enabled), set a real
  root password, and bind mongod to 127.0.0.1 or a private network.
reference: https://www.mongodb.com/docs/manual/security/
steps:
  - type: send
    data: "3a000000000000000000000000d40700000000000061646d696e2e24636d640000000000ffffffff130000001069736d6173746572000100000000"
    encoding: hex
  - type: match
    contains: "ismaster"
  - type: extract
    regex: "maxWireVersion.(\x02)(\x00)"
    name: wire_version
