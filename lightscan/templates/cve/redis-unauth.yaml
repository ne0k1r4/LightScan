id: CVE-2022-0543
name: CVE-2022-0543
severity: critical
cve: CVE-2022-0543
tags: [redis, unauth, exposure, database, cve-2022-0543]
port: 6379
protocol: tcp
description: >
  Redis answers without authentication. On Debian-packaged builds
  this also exposes the Lua sandbox escape CVE-2022-0543 — an
  unauthenticated EVAL/SCRIPT LOAD chain is remotely exploitable
  without any credentials.
remediation: Set requirepass in redis.conf; on distro-packaged builds also upgrade to a patched redis package
reference: https://nvd.nist.gov/vuln/detail/CVE-2022-0543
steps:
  - type: send
    data: "*1\r\n$4\r\nINFO\r\n"
  - type: match
    contains: redis_version
    not_contains: NOAUTH
  - type: extract
    regex: 'redis_version:([\d.]+)'
    group: 1
    name: version
