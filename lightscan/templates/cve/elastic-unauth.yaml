id: CVE-2015-5377
name: CVE-2015-5377
severity: critical
tags: [elasticsearch, unauth, exposure, cve-2015-5377]
port: 9200
protocol: http
description: Elasticsearch accessible without authentication
remediation: Enable X-Pack security
steps:
  - type: send
    data: /
  - type: match
    contains: cluster_name
    part: body
  - type: extract
    regex: '"number":\s*"([\d.]+)"'
    group: 1
    name: version
