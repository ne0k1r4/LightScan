id: elasticsearch-unauth
name: Elasticsearch without authentication
severity: critical
tags: [elasticsearch, unauth, exposure]
port: 9200
protocol: http
description: >
  Elasticsearch serves its REST API to unauthenticated callers. The
  whole cluster — indices, documents, mappings, even stored scripts —
  can be read, modified, or deleted by anyone who can connect. This is
  how the 2017 "ransomware" wipes happened.
remediation: >
  Enable Elastic security with a real password on every node and don't
  expose 9200 beyond the cluster network.
reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-minimal-setup.html
steps:
  - type: send
    data: /
  - type: match
    contains: cluster_name
    part: body
  - type: extract
    regex: '"number":\s*"([^"]+)"'
    group: 1
    name: version
