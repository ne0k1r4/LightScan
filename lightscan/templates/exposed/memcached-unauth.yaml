id: memcached-unauth
name: Memcached reachable without authentication
severity: high
cve: CVE-2018-1000115
tags: [memcached, unauth, exposure, cve-2018-1000115]
port: 11211
protocol: tcp
description: >
  Memcached answers stats without any auth. Beyond dumping whatever is
  cached (sessions, API tokens), an open 11211 with UDP enabled is the
  engine behind the 100x+ amplification attacks (CVE-2018-1000115).
remediation: >
  Bind memcached to 127.0.0.1 or a private interface and disable the UDP
  port unless something actually needs it.
reference: https://nvd.nist.gov/vuln/detail/CVE-2018-1000115
steps:
  - type: send
    data: "stats\r\n"
  - type: match
    contains: STAT version
  - type: extract
    regex: 'STAT version ([\d.]+)'
    group: 1
    name: version
