id: zookeeper-unauth
name: ZooKeeper four-letter commands without auth
severity: high
tags: [zookeeper, unauth, exposure]
port: 2181
protocol: tcp
description: >
  ZooKeeper's four-letter commands answer without authentication. mntr
  and conf leak the whole ensemble layout, and commands like rmr allow
  destructive changes to what is often the coordination backbone of a
  distributed system.
remediation: >
  Enable SASL authentication (requireClientAuthScheme=sasl) and firewall
  2181/2888/3888 to the ensemble only.
reference: https://zookeeper.apache.org/doc/current/zookeeperAdmin.html#sc_authOptions
steps:
  - type: send
    data: "mntr\n"
  - type: match
    contains: zk_version
  - type: extract
    regex: 'zk_version\s+([\d.]+)'
    group: 1
    name: version
