id: prometheus-unauth
name: Prometheus metrics endpoint exposed
severity: medium
tags: [prometheus, exposure, metrics]
port: 9090
protocol: http
description: >
  The Prometheus /metrics endpoint is public. Metric names and labels
  describe the whole stack — services, pods, versions, instance IPs —
  and the query API lets anyone walk the data Prometheus collects.
remediation: >
  Serve Prometheus behind an authenticated reverse proxy or bind it to
  127.0.0.1 with --web.listen-address.
reference: https://prometheus.io/docs/guides/securing-prometheus/
steps:
  - type: send
    data: /metrics
  - type: match
    regex: "(go_goroutines|process_cpu|HELP|TYPE)"
    part: body
