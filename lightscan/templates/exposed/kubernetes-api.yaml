id: kubernetes-api
name: Kubernetes API server without authentication
severity: critical
tags: [kubernetes, k8s, exposure]
port: 6443
protocol: https
description: >
  The kube-apiserver is reachable and answers without a valid token —
  anonymous auth is on or a weak client cert is accepted. A caller who
  can list secrets and exec into pods has effectively taken the cluster.
remediation: >
  Disable --anonymous-auth, enforce RBAC with least privilege, rotate
  admin client certs, and put the control plane on a trusted network.
reference: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
steps:
  - type: send
    data: /api/v1/namespaces
  - type: match
    regex: "(namespaces|items|kubernetes)"
    part: body
