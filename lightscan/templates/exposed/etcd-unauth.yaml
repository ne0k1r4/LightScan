id: CVE-2018-1099
name: CVE-2018-1099
severity: critical
tags: [etcd, kubernetes, unauth, exposure, cve-2018-1099]
port: 2379
protocol: http
description: etcd accessible without auth
remediation: Enable client certificate authentication
steps:
  - type: send
    data: /version
  - type: match
    contains: etcdserver
    part: body
  - type: extract
    regex: '"etcdserver":\s*"([^"]+)"'
    group: 1
    name: version
