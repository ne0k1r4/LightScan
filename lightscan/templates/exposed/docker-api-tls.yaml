id: docker-api-tls-exposed
name: Docker daemon API exposed (TLS port)
severity: high
tags: [docker, exposure]
port: 2376
protocol: https
description: >
  The Docker daemon is reachable on its TLS port. If the server trusts
  any client certificate (or an operator's key leaked), this is the same
  as the plaintext case — full control of the daemon and the host.
remediation: >
  Only accept clients that present the right certificate, rotate client
  keys, and keep the port off the public internet.
reference: https://docs.docker.com/engine/security/protect-access/
steps:
  - type: send
    data: /version
  - type: match
    contains: "ApiVersion"
    part: body
