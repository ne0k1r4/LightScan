id: grafana-default-creds
name: Grafana reachable without valid session
severity: high
tags: [grafana, default-creds, auth]
port: 3000
protocol: http
description: >
  Grafana answers unauthenticated API requests. Either anonymous access
  is switched on or the default admin/admin login was never changed —
  both give attackers dashboards and data, and often a path to SSRF via
  data-source probing.
remediation: >
  Force a password change on first login, disable anonymous access, and
  keep Grafana behind SSO or a VPN.
reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/
steps:
  - type: send
    data: /api/org
  - type: match
    status: [200]
  - type: match
    contains: "id"
    part: body
