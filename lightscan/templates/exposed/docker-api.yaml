id: docker-api
name: Docker daemon API exposed (no TLS)
severity: critical
tags: [docker, exposure, rce, container]
port: 2375
protocol: http
description: >
  The Docker daemon listens on TCP without TLS, so anyone can talk to it
  over HTTP. A POST to /containers/create followed by /start is
  effectively root on the host — bind-mounting the filesystem or
  spawning a privileged container makes it trivial.
remediation: >
  Bind the daemon to a unix socket (or 127.0.0.1) and require TLS client
  certificates if it must be reachable over the network.
reference: https://docs.docker.com/engine/security/protect-access/
steps:
  - type: send
    data: /version
  - type: match
    contains: ApiVersion
    part: body
  - type: extract
    regex: '"Version":\s*"([^"]+)"'
    group: 1
    name: version
