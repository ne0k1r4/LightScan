id: CVE-2019-7609
name: CVE-2019-7609
severity: high
tags: [kibana, elasticsearch, exposure, cve-2019-7609]
port: 5601
protocol: http
description: Kibana accessible without authentication
remediation: Enable X-Pack security
steps:
  - type: send
    data: /api/status
  - type: match
    regex: '"status"'
    part: body
  - type: extract
    regex: '"number":\s*"([^"]+)"'
    group: 1
    name: version
