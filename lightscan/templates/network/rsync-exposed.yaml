id: CVE-2018-5764
name: CVE-2018-5764
severity: high
tags: [rsync, file, exposure, unauth, cve-2018-5764]
port: 873
protocol: tcp
description: Rsync daemon accessible without authentication — file read/write possible
remediation: Add secrets file to rsync; restrict hosts allowed
steps:
  - type: send
    data: ""
  - type: match
    regex: "@RSYNCD"
  - type: send
    data: "#list\n"
  - type: extract
    regex: "([a-zA-Z0-9_-]+)\\s"
    group: 1
    name: module
