id: rsync-exposed
name: Rsync daemon without authentication
severity: high
tags: [rsync, file, exposure, unauth]
port: 873
protocol: tcp
description: >
  An rsync daemon answers with its module list — no auth required.
  Depending on module settings that means reading and writing arbitrary
  files on the host, including dotfiles and SSH keys.
remediation: >
  Require auth via the secrets file, list allowed hosts in
  /etc/rsyncd.conf, and expose only read-only modules if rsync must be
  public.
reference: https://download.samba.org/pub/rsync/rsyncd.conf.html
steps:
  - type: send
    data: ""
  - type: match
    regex: "@RSYNCD"
  - type: send
    data: "#list\n"
  - type: extract
    regex: "([a-zA-Z0-9_-]+)\\s"
    group: 1
    name: module
