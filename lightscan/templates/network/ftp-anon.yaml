id: ftp-anon
name: FTP anonymous login allowed
severity: high
tags: [ftp, anonymous, exposure]
port: 21
protocol: tcp
description: >
  The FTP server accepts the anonymous account. Depending on the
  configuration that is read access to everything, and often write access
  to the webroot for uploads — a classic way in.
remediation: >
  Disable anonymous FTP (or restrict it to a dedicated empty directory
  with no write permission) and move file sharing to SFTP/FTPS.
reference: https://vsftpd.beasts.org/vsftpd_conf.html
steps:
  - type: send
    data: ""
  - type: match
    regex: "220.*FTP"
  - type: send
    data: "USER anonymous\r\n"
  - type: match
    regex: "331|230"
  - type: extract
    regex: "220[- ](.+?)\r\n"
    group: 1
    name: banner
