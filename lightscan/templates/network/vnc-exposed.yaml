id: vnc-exposed
name: VNC server exposed
severity: critical
tags: [vnc, remote, unauth, exposure]
port: 5900
protocol: tcp
description: >
  A VNC server answers the RFB handshake. No password, a weak one, or the
  old 8-character challenge-response means an attacker gets the desktop
  — and with it everything the logged-in user can see and do.
remediation: >
  Set a strong VNC password, restrict the service to the VPN, and prefer
  SSH tunneling (or a VNC server that speaks TLS/VeNCrypt).
reference: https://www.realvnc.com/en/connect/docs/rfbproto.pdf
steps:
  - type: send
    data: ""
  - type: match
    regex: "RFB 00[0-9]"
  - type: extract
    regex: "RFB ([0-9.]+)"
    group: 1
    name: version
