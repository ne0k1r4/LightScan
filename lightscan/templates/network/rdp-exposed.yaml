id: rdp-exposed
name: RDP exposed to the network
severity: high
cve: CVE-2019-0708
tags: [rdp, windows, exposure, remote, cve-2019-0708]
port: 3389
protocol: tcp
description: >
  Port 3389 answers with a Remote Desktop handshake. Every exposed RDP
  service is a brute-force target, and pre-NLA configurations were the
  attack surface for BlueKeep (CVE-2019-0708).
remediation: >
  Put RDP behind the VPN (or at least an RDP gateway), enable Network
  Level Authentication, and apply the MS19-0708 patch on all Windows
  hosts.
reference: https://nvd.nist.gov/vuln/detail/CVE-2019-0708
steps:
  - type: send
    data: ""
  - type: match
    regex: "\x03\x00|RDP|Remote Desktop"
