id: CVE-2019-19499
name: CVE-2019-19499
severity: high
tags: [grafana, monitoring, unauth, exposure, cve-2019-19499]
port: 3000
protocol: http
description: Grafana accessible without authentication — dashboard data exposed
remediation: Disable anonymous access in grafana.ini
steps:
  - type: send
    data: /api/org
  - type: match
    contains: "name"
    part: body
  - type: match
    not_contains: "Unauthorized"
    part: body
