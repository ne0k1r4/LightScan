id: grafana-anon-access
name: Grafana anonymous access enabled
severity: high
tags: [grafana, monitoring, unauth, exposure]
port: 3000
protocol: http
description: >
  Grafana answers unauthenticated API requests — anonymous access is
  enabled or the default admin/admin login was never changed. Either
  way dashboards and data are visible without a login, and
  data-source probing can open an SSRF path.
remediation: >
  Disable anonymous access (auth.anonymous.enabled = false), force a
  password change on the admin account, and keep Grafana behind SSO
  or a VPN.
reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/grafana/
steps:
  - type: send
    data: /api/org
  - type: match
    status: [200]
  - type: match
    contains: "name"
    part: body
  - type: match
    not_contains: "Unauthorized"
    part: body
