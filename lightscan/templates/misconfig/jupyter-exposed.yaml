id: jupyter-exposed
name: Jupyter Notebook without token
severity: critical
tags: [jupyter, python, rce, unauth]
port: 8888
protocol: http
description: >
  Jupyter is running without token authentication. Anyone reaching the
  notebook server gets a browser-based Python kernel — a notebook cell
  with os.system() or subprocess is straight code execution on the host.
remediation: >
  Set a strong notebook token/password, bind to 127.0.0.1 (or run behind
  authenticated JupyterHub / a reverse proxy), and disable passwordless
  local servers.
reference: https://jupyter-notebook.readthedocs.io/en/stable/security.html
steps:
  - type: send
    data: /api/kernels
  - type: match
    regex: "(kernels|kernel_name|jupyter)"
    part: body
  - type: match
    not_contains: "Unauthorized"
    part: body
