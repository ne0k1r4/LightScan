id: CVE-2003-0865
name: CVE-2003-0865
severity: medium
tags: [php, exposure, info-disclosure, cve-2003-0865]
port: 80
protocol: http
description: phpinfo() page exposes server config
steps:
  - type: send
    data: /phpinfo.php
  - type: match
    contains: PHP Version
    part: body
  - type: extract
    regex: 'PHP Version ([\d.]+)'
    group: 1
    name: version
