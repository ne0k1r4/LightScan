id: phpinfo-exposed
name: phpinfo() page exposed
severity: medium
tags: [php, exposure, info-disclosure]
port: 80
protocol: http
description: >
  A phpinfo() page is publicly reachable. It prints the PHP build, loaded
  modules, environment variables and full server paths — a perfect
  reconnaissance checklist before targeting the app.
remediation: >
  Remove phpinfo() pages from production (or gate them behind admin
  auth); they are debug tooling, not application code.
reference: https://www.php.net/manual/en/function.phpinfo.php
steps:
  - type: send
    data: /phpinfo.php
  - type: match
    contains: PHP Version
    part: body
  - type: extract
    regex: 'PHP Version ([\d.]+)'
    group: 1
    name: version
