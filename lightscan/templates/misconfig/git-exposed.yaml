id: CVE-2020-11008
name: CVE-2020-11008
severity: high
tags: [git, exposure, source-code, cve-2020-11008]
port: 80
protocol: http
description: .git directory accessible via HTTP — full source code disclosure
remediation: Block /.git/ in webserver config; use .htaccess/nginx deny
steps:
  - type: send
    data: /.git/HEAD
  - type: match
    contains: "ref: refs/"
    part: body
