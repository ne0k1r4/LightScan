id: env-exposed
name: .env file exposed via HTTP
severity: critical
tags: [env, secrets, exposure, credentials]
port: 80
protocol: http
description: >
  The application's .env file is served over HTTP. These files routinely
  hold database passwords, API keys, mail credentials and app secrets —
  a full credential dump in a single request.
remediation: >
  Deny .env in the webserver config, move secrets to a vault or secret
  manager, and never commit .env to the repo in the first place.
reference: https://owasp.org/www-project-top-ten/
steps:
  - type: send
    data: /.env
  - type: match
    regex: "(DB_|APP_KEY|SECRET|PASSWORD|TOKEN|AWS_)"
    part: body
