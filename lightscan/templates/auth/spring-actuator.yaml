id: spring-actuator
name: Spring Boot Actuator endpoints exposed
severity: high
tags: [spring, java, actuator, exposure]
port: 8080
protocol: http
description: >
  Spring Boot Actuator management endpoints answer without protection.
  /actuator/env shows environment variables (cloud credentials, DB
  passwords), /actuator/heapdump dumps the JVM heap, and older configs
  even allow writes via /actuator/refresh or gateway routes.
remediation: >
  Never expose management endpoints publicly — keep the exposure list
  minimal, firewall them off, and add authentication where they must be
  reachable.
reference: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
steps:
  - type: send
    data: /actuator
  - type: match
    regex: "(actuator|health|env|beans|mappings)"
    part: body
  - type: send
    data: /actuator/env
  - type: match
    regex: "(applicationConfig|systemProperties|PATH)"
    part: body
