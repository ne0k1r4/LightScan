id: CVE-2019-7609
name: CVE-2019-7609
severity: high
tags: [kibana, elasticsearch, unauth, exposure, cve-2019-7609]
port: 5601
protocol: http
description: Kibana accessible without authentication — Elasticsearch data exposed
remediation: Enable X-Pack security; configure authentication
steps:
  - type: send
    data: /api/status
  - type: match
    regex: "(kibana|status|version)"
    part: body
  - type: match
    not_contains: "Unauthorized"
    part: body
