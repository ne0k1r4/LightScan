id: wp-xmlrpc
name: WordPress XML-RPC enabled
severity: medium
tags: [wordpress, xmlrpc, brute-force]
port: 80
protocol: http
description: >
  /xmlrpc.php answers with the XML-RPC API enabled. system.multicall
  batches hundreds of password guesses into one request (amplified
  brute-force) and the pingback handler can be abused for SSRF.
remediation: >
  Disable XML-RPC unless a plugin genuinely needs it — block xmlrpc.php
  with a firewall rule or a plugin like "Disable XML-RPC".
reference: https://developer.wordpress.org/plugins/xml-rpc/
steps:
  - type: send
    data: /xmlrpc.php
  - type: match
    contains: "XML-RPC server accepts POST requests only"
    part: body
