id: CVE-2020-26947
name: CVE-2020-26947
severity: high
tags: [phpmyadmin, mysql, web, exposure, cve-2020-26947]
port: 80
protocol: http
description: phpMyAdmin accessible from internet
steps:
  - type: send
    data: /phpmyadmin/
  - type: match
    contains: phpMyAdmin
    part: body
  - type: extract
    regex: 'PMA_VERSION[^0-9]*([\d.]+)'
    group: 1
    name: version
