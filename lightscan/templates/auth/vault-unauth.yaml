id: CVE-2020-35184
name: CVE-2020-35184
severity: critical
tags: [vault, hashicorp, secrets, unauth, cve-2020-35184]
port: 8200
protocol: http
description: Vault API accessible — secrets engine status visible
remediation: Enable authentication; restrict Vault API access
steps:
  - type: send
    data: /v1/sys/health
  - type: match
    regex: "(initialized|sealed|version)"
    part: body
