id: jenkins-unauth
name: Jenkins reachable without authentication
severity: critical
tags: [jenkins, cicd, unauth, rce]
port: 8080
protocol: http
description: >
  Jenkins answers requests with anonymous access still enabled. The
  /script console hands anyone who reaches it a Groovy shell running as
  the Jenkins service account, which usually means OS command execution
  and straight into the CI/CD pipeline.
remediation: >
  Enable Jenkins' own security realm plus a strict authorization strategy
  (matrix- or role-based), kill anonymous read access, and keep the
  instance behind the corporate network or a VPN.
reference: https://www.jenkins.io/doc/book/security/securing-jenkins/
steps:
  - type: send
    data: /
  - type: match
    contains: "Jenkins"
    part: body
  - type: send
    data: /script
  - type: match
    status: [200]
  - type: match
    contains: "Groovy"
    part: body
