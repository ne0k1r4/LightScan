id: tomcat-manager
name: Tomcat Manager application exposed
severity: high
tags: [tomcat, manager, default-creds]
port: 8080
protocol: http
description: >
  The Tomcat Manager webapp is reachable — either the login page is
  exposed or (worse) it answers without credentials. Manager access lets
  anyone deploy a WAR, which is a straight path to remote code execution
  on the host.
remediation: >
  Remove the manager app if it is not used, restrict it to localhost or
  trusted networks, and enforce strong passwords in tomcat-users.xml.
reference: https://tomcat.apache.org/tomcat-10.0-doc/manager-howto.html
steps:
  - type: send
    data: /manager/html
  - type: match
    status: [200, 401]
  - type: match
    contains: "Tomcat"
    part: body
