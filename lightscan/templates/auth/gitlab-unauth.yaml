id: CVE-2019-11547
name: CVE-2019-11547
severity: medium
tags: [gitlab, registration, exposure, cve-2019-11547]
port: 80
protocol: http
description: GitLab allows unrestricted user registration — code exposure
steps:
  - type: send
    data: /users/sign_up
  - type: match
    status: [200]
  - type: match
    contains: "New user"
    part: body
